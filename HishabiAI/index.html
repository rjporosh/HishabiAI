'],['সিএনজি','সিএনজি'],['বাজার','মুদিখানা'],['মুদি','মুদিখানা']];if(!found)for(const [s,name] of syn){if(lower.includes(Utils.norm(s))){found=this.state.cats.find(c=>Utils.norm(c.bn)===Utils.norm(name)||Utils.norm(c.en)===Utils.norm(name));if(found)break}}if(!amount){UI.toast(this.t('noAmount'));return}const route=n.match(/(.+?)(?:থেকে|from)\s+(.+?)(?:\s+(?:যাওয়া|যাব|to|পর্যন্ত|গিয়ে)|$)/i);const d={date:Utils.dateISO(),time:Utils.timeNow(),amount,quantity:qty,unit,categoryId:found?.id||'',paymentMethod:'cash',note:text,type:'expense',journeyFrom:route?.[1]?.trim()||'',journeyTo:route?.[2]?.trim()||''};if(!found){UI.close();this.openCat();UI.toast(this.t('noCategory'));return}UI.close();this.openTx(null,'expense',d);setTimeout(()=>{const f=document.getElementById('txForm');if(!f)return;Object.entries(d).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v??''})},30)},openCatFromTxSearch(){this.openCat()},async saveBalance(){try{await Balance.save(Utils.dateISO(),Number(document.getElementById('startBalance').value));await this.reload();this.render();UI.toast(this.t('saved'))}catch(e){UI.toast(e.message)}},loadDemo:async function(){const now=new Date();const find=n=>this.state.cats.find(c=>Utils.norm(c.en)===Utils.norm(n)||Utils.norm(c.bn)===Utils.norm(n));for(const [n,q,u,a] of [['Rice',5,'kg',450],['Oil',2,'litre',360],['Rickshaw Fare',1,'trip',80],['Tea',2,'pack',120]]){const c=find(n);await Tx.save({date:Utils.dateISO(now),time:'18:30',amount:a,quantity:q,unit:u,categoryId:c?.id,categoryPath:c?Cat.labelPath(c.id,this.state.cats):'',paymentMethod:'cash',note:'Demo',type:'expense',demo:true,allowDuplicate:true})}await this.reload();this.render();UI.toast(this.t('demo'))},clearDemo:async function(){for(const x of [...this.state.tx])if(x.demo)await Tx.remove(x.id);await this.reload();this.render();UI.toast(this.t('clearDemo'))},async restoreFile(input){const f=input.files?.[0];if(!f)return;UI.modal(`<h2 class="title">${this.t('restore')}</h2><div class="notice" st
