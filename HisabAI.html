const Utils={
 uid(prefix='id'){return prefix+'_'+crypto.randomUUID()},
 now(){return new Date().toISOString()},
 dateISO(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},
 timeNow(d=new Date()){return d.toTimeString().slice(0,5)},
 money(n){return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})},
 num(n){return Number(n||0).toLocaleString()},
 esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))},
 norm(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu,'').trim()},
 date(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})},
 monthKey(d){return d.slice(0,7)},
 pct(a,b){return b===0?(a===0?0:null):((a-b)/Math.abs(b))*100},
 clamp(n,a,b){return Math.max(a,Math.min(b,n))}
};

const DatabaseService={
 db:null, demoPrefix:'demo_',
 async init(){
  return new Promise((res,rej)=>{
   const req=indexedDB.open('HisabAI_V1',1);
   req.onupgradeneeded=e=>{
    const db=e.target.result;
    if(!db.objectStoreNames.contains('transactions')){const s=db.createObjectStore('transactions',{keyPath:'id'});s.createIndex('date','date');s.createIndex('type','type');s.createIndex('categoryId','categoryId');}
    if(!db.objectStoreNames.contains('categories')){const s=db.createObjectStore('categories',{keyPath:'id'});s.createIndex('parentId','parentId');s.createIndex('nameNorm','nameNorm');}
    if(!db.objectStoreNames.contains('balances')){const s=db.createObjectStore('balances',{keyPath:'date'});}
    if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'key'});
   };
   req.onsuccess=e=>{this.db=e.target.result;res(this.db)};
   req.onerror=()=>rej(req.error||new Error('IndexedDB unavailable'));
  })
 },
 tx(store,mode='readonly'){return this.db.transaction(store,mode).objectStore(store)},
 async put(store,obj){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)})},
 async add(store,obj){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').add(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)})},
 async del(store,key){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
 async get(store,key){return new Promise((res,rej)=>{const r=this.tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async all(store){return new Promise((res,rej)=>{const r=this.tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
 async clearWhere(store,pred){const all=await this.all(store);for(const x of all)if(pred(x))await this.del(store,x.id??x.date??x.key);},
 async setting(key,val){if(val!==undefined)return this.put('settings',{key,value:val,updatedAt:Utils.now()});const x=await this.get('settings',key);return x?.value}
};

const CategoryService={
 async all(){return DatabaseService.all('categories')},
 async seed(){
  if((await this.all()).length)return;
  const roots=['Food','Transport','Smoking','Housing','Health','Shopping','Bills','Entertainment'];
  const map={};
  for(const n of roots){const id=Utils.uid('cat');map[n]=id;await this.create(n,null,id)}
  const children={
   Food:['Grocery','Restaurant'],Grocery:['Rice','Oil','Tea','Vegetables'],Transport:['Rickshaw Fare','Bus','CNG'],
   Smoking:['Biri','Cigarette'],Housing:['Rent','Utilities'],Health:['Medicine','Doctor'],Shopping:['Clothing','Household'],
   Bills:['Internet','Electricity','Mobile'],Entertainment:['Movies','Games']
  };
  const parentMap={};
  for(const root of roots)parentMap[root]=map[root];
  for(const [p,arr] of Object.entries(children)){
   const parentId=parentMap[p]||map[p];
   for(const n of arr){const id=Utils.uid('cat');parentMap[n]=id;await this.create(n,parentId,id)}
  }
 },
 async create(name,parentId=null,id=Utils.uid('cat')){
  name=String(name||'').trim();if(!name)throw Error('Category name required');
  const all=await this.all(),norm=Utils.norm(name);
  if(all.some(c=>c.parentId===(parentId||null)&&c.nameNorm===norm))throw Error(LocalizationService.t('categoryDuplicate'));
  return DatabaseService.add('categories',{id,name,nameNorm:norm,parentId:parentId||null,createdAt:Utils.now(),updatedAt:Utils.now(),deleted:false})
 },
 async update(id,name){
  const all=await this.all(),c=all.find(x=>x.id===id);if(!c)return;
  const norm=Utils.norm(name);
  if(all.some(x=>x.id!==id&&x.parentId===c.parentId&&x.nameNorm===norm))throw Error(LocalizationService.t('categoryDuplicate'));
  c.name=String(name).trim();c.nameNorm=norm;c.updatedAt=Utils.now();await DatabaseService.put('categories',c)
 },
 async remove(id){
  const all=await this.all(), children=all.filter(x=>x.parentId===id);
  for(const c of children)await this.remove(c.id);
  const c=all.find(x=>x.id===id);if(c){c.deleted=true;c.updatedAt=Utils.now();await DatabaseService.put('categories',c)}
 },
 async path(id,all=null){
  all=all||await this.all();let c=all.find(x=>x.id===id),p=[];const seen=new Set();
  while(c&&!seen.has(c.id)){seen.add(c.id);p.unshift(c.name);c=all.find(x=>x.id===c.parentId)}
  return p.join(' > ')
 },
 tree(all){
  const active=all.filter(c=>!c.deleted),by=new Map(active.map(c=>[c.id,{...c,children:[]}]));
  const roots=[];for(const c of active){if(c.parentId&&by.has(c.parentId))by.get(c.parentId).children.push(by.get(c.id));else roots.push(by.get(c.id))}
  return roots
 },
 options(all,selected=''){
  const out=[];
  const walk=(nodes,depth)=>nodes.forEach(n=>{out.push(`<option value="${n.id}" ${n.id===selected?'selected':''}>${'— '.repeat(depth)}${Utils.esc(n.name)}</option>`);walk(n.children,depth+1)});
  walk(this.tree(all),0);return out.join('')
 }
};

const TransactionService={
 async all(){return DatabaseService.all('transactions')},
 async save(data){
  const amount=Number(data.amount),qty=data.quantity===''||data.quantity==null?null:Number(data.quantity);
  if(!Number.isFinite(amount)||amount<=0)throw Error(LocalizationService.t('amountRequired'));
  if(qty!==null&&(!Number.isFinite(qty)||qty<=0))throw Error(LocalizationService.t('amountRequired'));
  const all=await this.all();
  const duplicate=all.find(x=>x.id!==data.id&&x.date===data.date&&x.time===data.time&&x.amount===amount&&x.type===data.type&&x.categoryId===data.categoryId&&String(x.note||'').trim()===String(data.note||'').trim());
  if(duplicate&&!data.allowDuplicate)throw Error(LocalizationService.t('duplicate'));
  const old=data.id?all.find(x=>x.id===data.id):null;
  const obj={id:data.id||Utils.uid('tx'),date:data.date,time:data.time,amount,quantity:qty,unit:String(data.unit||''),categoryId:data.categoryId||null,
   categoryPath:data.categoryPath||'',paymentMethod:data.paymentMethod||'cash',note:String(data.note||''),type:data.type||'expense',
   createdAt:old?.createdAt||Utils.now(),updatedAt:Utils.now(),demo:!!data.demo,syncStatus:'pending'};
  await DatabaseService.put('transactions',obj);return obj
 },
 async remove(id){await DatabaseService.del('transactions',id)},
 async between(a,b){return (await this.all()).filter(x=>x.date>=a&&x.date<=b)},
 async totals(a,b){const xs=await this.between(a,b);return {expense:xs.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),income:xs.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),count:xs.length,avg:xs.filter(x=>x.type==='expense').length?xs.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)/xs.filter(x=>x.type==='expense').length:0}}
};

const BalanceService={
 async get(date){return await DatabaseService.get('balances',date)||{date,starting:0,updatedAt:Utils.now()}},
 async save(date,starting){if(!Number.isFinite(Number(starting))||Number(starting)<0)throw Error('Invalid balance');return DatabaseService.put('balances',{date,starting:Number(starting),updatedAt:Utils.now(),syncStatus:'pending'})},

const ReportService={
 periods(){
  const now=new Date(),today=Utils.dateISO(now),y=new Date(now);y.setDate(y.getDate()-1);
  const monday=new Date(now);monday.setHours(0,0,0,0);monday.setDate(now.getDate()-((now.getDay()+6)%7));
  const prevEnd=new Date(monday);prevEnd.setDate(prevEnd.getDate()-1);const prevStart=new Date(prevEnd);prevStart.setDate(prevStart.getDate()-6);
  const first=new Date(now.getFullYear(),now.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth()+1,0);
  const prevFirst=new Date(now.getFullYear(),now.getMonth()-1,1),prevLast=new Date(now.getFullYear(),now.getMonth(),0);
  return {
   today:[today,today],yesterday:[Utils.dateISO(y),Utils.dateISO(y)],thisWeek:[Utils.dateISO(monday),today],
   prevWeek:[Utils.dateISO(prevStart),Utils.dateISO(prevEnd)],firstHalf:[Utils.dateISO(first),Utils.dateISO(new Date(now.getFullYear(),now.getMonth(),15))],
   secondHalf:[Utils.dateISO(new Date(now.getFullYear(),now.getMonth(),16)),Utils.dateISO(last)],
   thisMonth:[Utils.dateISO(first),Utils.dateISO(last)],prevMonth:[Utils.dateISO(prevFirst),Utils.dateISO(prevLast)],
   thisYear:[`${now.getFullYear()}-01-01`,`${now.getFullYear()}-12-31`],prevYear:[`${now.getFullYear()-1}-01-01`,`${now.getFullYear()-1}-12-31`]
  }
 },
 async aggregate(a,b){
  const [xs,cats]=await Promise.all([TransactionService.between(a,b),CategoryService.all()]);
  const cm=new Map(cats.map(c=>[c.id,c]));const expense=xs.filter(x=>x.type==='expense');
  const byCat=new Map(),byUnit=new Map();
  for(const x of expense){const key=x.categoryId||'uncat';const name=x.categoryPath||cm.get(x.categoryId)?.name||'Uncategorized';const o=byCat.get(key)||{key,name,amount:0,quantity:0,units:{}};o.amount+=x.amount;if(x.quantity!=null){o.quantity+=x.quantity;o.units[x.unit||'unit']=(o.units[x.unit||'unit']||0)+x.quantity}byCat.set(key,o);
   if(x.quantity!=null){const u=x.unit||'unit';byUnit.set(u,(byUnit.get(u)||0)+x.quantity)}
  }
  return {xs,expense,total:expense.reduce((s,x)=>s+x.amount,0),income:xs.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),count:expense.length,avg:expense.length?expense.reduce((s,x)=>s+x.amount,0)/expense.length:0,
   categories:[...byCat.values()].sort((a,b)=>b.amount-a.amount),units:[...byUnit.entries()].map(([unit,quantity])=>({unit,quantity}))};
 }
};

const AnalyticsService={
 async monthly(a,b){
  const xs=await TransactionService.between(a,b),m=new Map();
  for(const x of xs.filter(x=>x.type==='expense')){const k=x.date.slice(0,7);m.set(k,(m.get(k)||0)+x.amount)}
  return [...m.entries()].sort()
 },
 async compare(a,b,c,d){
  const [A,B]=await Promise.all([ReportService.aggregate(a,b),ReportService.aggregate(c,d)]);
  const names=new Set([...A.categories,...B.categories].map(x=>x.name)),rows=[];
  for(const name of names){const av=A.categories.find(x=>x.name===name),bv=B.categories.find(x=>x.name===name);rows.push({name,a:av?.amount||0,b:bv?.amount||0,change:(av?.amount||0)-(bv?.amount||0),pct:Utils.pct(av?.amount||0,bv?.amount||0)})}
  return {A,B,rows:rows.sort((x,y)=>Math.abs(y.change)-Math.abs(x.change))}
 }
};

const SpeechService={
 recognition:null,active:false,
 supported(){return 'SpeechRecognition'in window||'webkitSpeechRecognition'in window},
 start(onResult,onEnd,onError){
  if(!this.supported()){onError?.(LocalizationService.t('unsupported'));return}
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;this.recognition=new R();this.recognition.lang=LocalizationService.lang==='bn'?'bn-BD':'en-US';
  this.recognition.interimResults=false;this.recognition.maxAlternatives=3;this.active=true;
  this.recognition.onresult=e=>onResult(e.results[0][0].transcript);this.recognition.onend=()=>{this.active=false;onEnd?.()};this.recognition.onerror=e=>{this.active=false;onError?.(e.error)};
  this.recognition.start()
 },
 stop(){try{this.recognition?.stop()}catch{}}
};

const ExportService={
 async excel(){
  if(!window.XLSX)throw Error('SheetJS unavailable');
  const [tx,cats,balances]=await Promise.all([TransactionService.all(),CategoryService.all(),BalanceService.all()]),cm=new Map(cats.map(c=>[c.id,c.name]));
  const rows=tx.map(x=>({ID:x.id,Date:x.date,Time:x.time,Type:x.type==='expense'?LocalizationService.t('expense'):LocalizationService.t('income'),Amount_BDT:x.amount,Quantity:x.quantity??'',Unit:x.unit,Category:x.categoryPath||cm.get(x.categoryId)||'',Payment:x.paymentMethod,Note:x.note,Created:x.createdAt,Updated:x.updatedAt}));
  const catAgg=new Map(),unitAgg=new Map();
  for(const x of tx.filter(x=>x.type==='expense')){const k=x.categoryPath||cm.get(x.categoryId)||'Uncategorized';const o=catAgg.get(k)||{Category:k,Expense_BDT:0,Quantity:0};o.Expense_BDT+=x.amount;o.Quantity+=x.quantity||0;catAgg.set(k,o);if(x.quantity!=null)unitAgg.set(x.unit||'unit',(unitAgg.get(x.unit||'unit')||0)+x.quantity)}
  const wb=XLSX.utils.book_new(), add=(name,data)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),name);
  add('Summary',[{Metric:LocalizationService.t('totalExpense'),Value:tx.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)},{Metric:LocalizationService.t('totalIncome'),Value:tx.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0)},{Metric:LocalizationService.t('count'),Value:tx.length}]);
  add('Transactions',rows);add('Category Analysis',[...catAgg.values()]);add('Subcategory Analysis',[...catAgg.values()]);
  add('Quantity Consumption',[...unitAgg].map(([Unit,Quantity])=>({Unit,Quantity})));add('Monthly Comparison',await this.monthlyRows(tx));
  XLSX.writeFile(wb,'HisabAI_Financial_Report.xlsx');App.toast(LocalizationService.t('excelReady'))
 },

};

 async parseVoice(text){
  const amountMatch=text.match(/(?:৳|টাকা|taka|bdt|Tk\.?)\s*([\d০-৯]+(?:[.,]\d+)?)/i)||text.match(/([\d০-৯]+(?:[.,]\d+)?)\s*(?:৳|টাকা|taka|bdt|tk)/i);
  const bn='০১২৩৪৫৬৭৮৯';const toNum=s=>String(s).replace(/[০-৯]/g,c=>bn.indexOf(c));const amount=amountMatch?Number(toNum(amountMatch[1]).replace(/,/g,'')):null;
  const qMatch=text.match(/([\d০-৯]+(?:[.,]\d+)?)\s*(কেজি|কিলো|লিটার|গ্রাম|প্যাক|প্যাকেট|টা|টি|trip|kg|kgs|litre|liter|gram|pack|piece|pcs|ট্রিপ)/i);
  const quantity=qMatch?Number(toNum(qMatch[1]).replace(',','.')):null,unit=qMatch?qMatch[2]:'';
  const lower=Utils.norm(text),cats=this.state.cats;
  let found=cats.find(c=>lower.includes(Utils.norm(c.name)));
  const synonyms=[['রিকশা','Rickshaw Fare'],['রিকশাভাড়া','Rickshaw Fare'],['চাল','Rice'],['ভাড়া','Rickshaw Fare'],['তেল','Oil'],['চা','Tea'],['বিরি','Biri'],['সিগারেট','Cigarette'],['বাস','Bus'],['সিএনজি','CNG'],['বাজার','Grocery']];
  if(!found){for(const [s,n] of synonyms){if(lower.includes(Utils.norm(s))){found=cats.find(c=>Utils.norm(c.name)===Utils.norm(n));if(found)break}}}
  if(!amount){UIService.toast('Could not detect an amount.','error');return}
  if(!found){UIService.close();UIService.modal(`<h2 class="text-xl font-black">${this.t('createCategory')}</h2><p class="mt-2">No suitable existing category was found for: <b>${Utils.esc(text)}</b></p><input id="voiceCat" class="input mt-4" value="${Utils.esc(qMatch?text.replace(qMatch[0],'').replace(amountMatch?.[0]||'','').trim():text)}"><div class="flex justify-end gap-2 mt-4"><button class="btn btn-ghost" onclick="UIService.close()">${this.t('cancel')}</button><button class="btn btn-primary" onclick="App.createVoiceCat(${amount},${quantity??'null'},'${Utils.esc(unit)}','${Utils.esc(text).replace(/'/g,"&#39;")}')">${this.t('create')}</button></div>`);return}
  UIService.close();this.openTx(null,'expense',{});
  setTimeout(()=>{const form=document.querySelector('#modal form');if(form){form.amount.value=amount;if(quantity!=null)form.quantity.value=quantity;form.unit.value=unit;form.categoryId.value=found.id;form.note.value=text}},30)
 },
